<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reels логопедів</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root { --bg: #f4f6f8; --panel: #fff; --ink: #18202b; --muted: #5d6877; --line: #dde3ea; --accent: #1f6f78; color-scheme: light; }
:root[data-theme="dark"] { --bg: #11161c; --panel: #19212a; --ink: #e8edf2; --muted: #9aa7b6; --line: #2a3542; --accent: #5fb7bf; color-scheme: dark; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
.wrap { max-width: 520px; margin: 0 auto; padding: 28px 16px; display: grid; gap: 14px; }
h1 { font-size: 22px; margin: 0 0 6px; }
a.card { display: grid; grid-template-columns: 44px 1fr; gap: 14px; align-items: center; padding: 18px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); color: inherit; text-decoration: none; }
a.card:active { border-color: var(--accent); }
.ic { font-size: 30px; text-align: center; }
.t { font-weight: 600; font-size: 17px; }
.d { color: var(--muted); font-size: 13.5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Reels логопедів</h1>
  <a class="card" href="dashboard.html"><span class="ic">📊</span><span><span class="t">Дашборд</span><br><span class="d">Що набирає охоплення, теми, ритм, ми проти ринку</span></span></a>
  <a class="card" href="ideas.html"><span class="ic">💡</span><span><span class="t">Банк ідей</span><br><span class="d">Органічні хіти конкурентів і наша дошка ідей</span></span></a>
</div>
<script src="tg.js"></script>
</body>
</html>
