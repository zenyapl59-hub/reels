<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reels: студія</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* ---------- палітра: два акценти (ринок і ми) + нейтральні ---------- */
:root {
  --bg: #f4f6f8; --panel: #ffffff; --ink: #18202b; --muted: #5d6877; --line: #e1e6ec; --soft: #eef2f5; --sk: #e3e8ee; --sk-hi: #f3f6f8;
  --accent: #1f6f78; --accent-ink: #ffffff; --accent-soft: #e2f0f1;
  --us: #c2621a; --us-soft: #fbeadc; --c3: #7d8a99;
  --warn-soft: #fbefd9; --warn-ink: #7a4b00; --good: #2e7d4f; --bad: #b3261e;
  --shadow: 0 8px 28px rgba(16, 24, 40, .14);
  --display: "Unbounded", "Onest", system-ui, sans-serif; --body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 16px; --navw: 232px; --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #11161c; --panel: #19212a; --ink: #e8edf2; --muted: #9aa7b6; --line: #2a3542; --soft: #222c37; --sk: #222c37; --sk-hi: #2e3a48;
  --accent: #5fb7bf; --accent-ink: #0d1a1c; --accent-soft: #1b3236;
  --us: #f0a060; --us-soft: #3a2a1c; --c3: #8d9aaa;
  --warn-soft: #3a2c12; --warn-ink: #f2c879; --good: #6cc28f; --bad: #f08a80;
  --shadow: 0 8px 28px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); -webkit-tap-highlight-color: transparent; }
body.lock-scroll { overflow: hidden; }
.locked .shell { visibility: hidden; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- каркас і бокове меню ---------- */
.shell { display: grid; grid-template-columns: var(--navw) minmax(0, 1fr); min-height: 100vh; transition: grid-template-columns .3s var(--ease); }
body.mini { --navw: 76px; }
.nav { position: sticky; top: 0; height: 100vh; overflow: hidden; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; padding: 16px 12px; }
.brand { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 8px; margin-bottom: 12px; white-space: nowrap; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; font: 600 14px var(--display); }
.brand b { font: 600 14px/1.2 var(--display); }
.item { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: none; color: var(--muted); font-weight: 500; text-decoration: none; white-space: nowrap; width: 100%; text-align: left; transition: background .2s, color .2s; }
.item:hover { background: var(--soft); color: var(--ink); }
.item[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
.item[aria-current="page"] .ico { color: var(--accent); }
.lbl, .brand b { transition: opacity .2s; }
.nav .sep { height: 1px; background: var(--line); margin: 8px 6px; }
.nav .spacer { flex: 1; }
.collapse .ico { transition: transform .3s var(--ease); }
body.mini .brand b { opacity: 0; pointer-events: none; }
/* згорнуте меню: іконка + короткий підпис під нею */
body.mini .item { flex-direction: column; justify-content: center; gap: 2px; height: 56px; padding: 0 2px; text-align: center; }
body.mini .item .lbl { font-size: 10px; line-height: 1.1; white-space: normal; }
body.mini .collapse .ico { transform: rotate(180deg); }
.scrim { display: none; }
.menu-btn { display: none; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); place-items: center; flex: none; }
@media (max-width: 1023px) and (min-width: 640px) {
  body { --navw: 76px; }
  .brand b { opacity: 0; pointer-events: none; }
  .item { flex-direction: column; justify-content: center; gap: 2px; height: 56px; padding: 0 2px; text-align: center; }
  .item .lbl { font-size: 10px; line-height: 1.1; white-space: normal; }
  .collapse { display: none; }
}
@media (max-width: 639px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .nav { position: fixed; z-index: 40; left: 0; top: 0; bottom: 0; height: auto; width: 280px; transform: translateX(-102%); transition: transform .3s var(--ease); box-shadow: var(--shadow); padding-top: max(16px, env(safe-area-inset-top)); }
  body.drawer .nav { transform: none; }
  .scrim { display: block; position: fixed; inset: 0; z-index: 39; background: rgba(0, 0, 0, .4); opacity: 0; pointer-events: none; transition: opacity .3s; }
  body.drawer .scrim { opacity: 1; pointer-events: auto; }
  .collapse { display: none; }
  .menu-btn { display: grid; }
  body.mini .brand b { opacity: 1; pointer-events: auto; }
  body.mini .item { flex-direction: row; justify-content: flex-start; gap: 12px; height: 44px; padding: 0 14px; text-align: left; }
  body.mini .item .lbl { font-size: 15px; white-space: nowrap; }
}

/* ---------- основна колонка ---------- */
.app { width: 100%; max-width: 1040px; margin: 0 auto; padding: 16px 24px 64px; display: grid; gap: 16px; align-content: start; min-width: 0; }
@media (max-width: 639px) { .app { padding: 12px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); gap: 12px; } }
.hdr { display: flex; align-items: center; gap: 12px; min-width: 0; }
.hdr .tt { min-width: 0; flex: 1; }
h1 { font: 600 clamp(18px, 4.6vw, 24px)/1.2 var(--display); margin: 0; letter-spacing: -.01em; }
.upd { font-size: 12px; color: var(--muted); margin-top: 2px; }
.hdr .to-ideas { flex: none; font-size: 13px; white-space: nowrap; }
@media (max-width: 639px) { .hdr .to-ideas { display: none; } }
.bar { position: sticky; top: 0; z-index: 10; background: var(--bg); margin: 0 -4px; padding: 8px 4px; display: grid; gap: 8px; transition: box-shadow .2s; }
.bar.stuck { box-shadow: 0 1px 0 var(--line); }
.bar[hidden] { display: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips[hidden] { display: none; }
.chip { flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; transition: background .2s, color .2s, border-color .2s; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.f { background: var(--accent-soft); border-color: transparent; }
.chip.f .ico { width: 14px; height: 14px; }
section[data-p] { display: grid; gap: 12px; min-width: 0; animation: enter .35s var(--ease) both; }
section[data-p][hidden] { display: none; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
h2 { font-size: 17px; font-weight: 600; margin: 0; line-height: 1.3; }
.note { color: var(--muted); font-size: 13px; margin: 4px 0 12px; }
.pagenote { color: var(--muted); font-size: 13px; margin: 0; }

/* ---------- головні цифри ---------- */
.hero { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 639px) { .hero { gap: 8px; } .hero .card { padding: 12px; } }
@media (max-width: 359px) { .hero { grid-template-columns: 1fr; } }
.k { color: var(--muted); font-size: 12px; line-height: 1.3; }
.big { font: 600 clamp(20px, 6vw, 28px)/1.15 var(--display); margin-top: 8px; font-variant-numeric: tabular-nums; }
.big.sm { font: 600 15px/1.3 var(--body); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sub { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.35; }
.sub.up { color: var(--good); } .sub.down { color: var(--bad); }
.takes { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.takes li { display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start; font-size: 14px; animation: enter .4s var(--ease) both; }
.takes .ic { width: 32px; height: 32px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.takes .ic .ico { width: 18px; height: 18px; }

/* ---------- стрічка рилсів ---------- */
.strip { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
.strip.end { -webkit-mask-image: none; mask-image: none; }
.strip.is-empty { display: block; -webkit-mask-image: none; mask-image: none; }
.strip::-webkit-scrollbar { display: none; }
.tile { flex: none; width: 132px; scroll-snap-align: start; border: 0; padding: 0; background: none; text-align: left; animation: enter .45s var(--ease) both; }
.cover { width: 132px; height: 208px; border-radius: 12px; background: var(--soft) center/cover; position: relative; overflow: hidden; display: block; transition: transform .25s var(--ease), box-shadow .25s; }
@media (hover: hover) { .tile:hover .cover { transform: translateY(-3px); box-shadow: var(--shadow); } }
.cover .v { position: absolute; left: 6px; bottom: 6px; background: rgba(0, 0, 0, .64); color: #fff; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.cover .xx { position: absolute; right: 6px; top: 6px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 999px; }
.tile .who { font-size: 12px; color: var(--muted); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .tp { font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- смуги ---------- */
.rows { display: grid; gap: 4px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 10px 8px; margin: 0 -8px; border: 0; border-radius: 12px; background: none; text-align: left; width: calc(100% + 16px); transition: background .2s; }
button.row:hover, .row.on { background: var(--soft); }
.row .l { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .r { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.track { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; position: relative; transition: height .2s var(--ease); }
.row.on .track, button.row:hover .track { background: var(--panel); }
@media (hover: hover) { button.row:hover .track { height: 10px; } button.row:hover .fill { filter: brightness(1.08); } }
.fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 4px; background: var(--accent); transition: width .75s var(--ease), filter .2s; }
.row .mini { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }

/* ---------- список рилсів ---------- */
.search { position: relative; margin: 12px 0 8px; }
.search .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 18px; height: 18px; }
input[type=search] { font: inherit; font-size: 15px; width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px 8px 38px; background: var(--panel); color: var(--ink); }
.list .it { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; width: 100%; text-align: left; transition: background .2s; }
.list .it:last-child { border-bottom: 0; }
@media (hover: hover) { .list .it:hover { background: var(--soft); } }
.th { width: 44px; height: 68px; border-radius: 8px; background: var(--soft) center/cover; }
.list .a { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; min-width: 0; }
.list .a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .b { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .c { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 14px; }
.list .c small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.ad { flex: none; font-size: 11px; font-weight: 500; padding: 1px 6px; border-radius: 999px; background: var(--warn-soft); color: var(--warn-ink); }
.more { margin-top: 8px; width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-weight: 500; }

/* ---------- акаунти ---------- */
.accs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.acc { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 16px; animation: enter .4s var(--ease) both; transition: border-color .2s, box-shadow .2s, transform .2s var(--ease); }
@media (hover: hover) { .acc:hover { box-shadow: var(--shadow); transform: translateY(-2px); } }
.acc.us { border-color: var(--us); }
.av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 17px; background: var(--accent-soft); color: var(--accent); }
.av.us { background: var(--us-soft); color: var(--us); }
.acc .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.stats div { font-size: 12px; color: var(--muted); }
.stats b { display: block; font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
.spark { display: block; width: 100%; height: 32px; margin-top: 8px; overflow: visible; }

/* ---------- порівняння ---------- */
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 479px) { .pick { grid-template-columns: 1fr; } }
.pick label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.pick label span { display: flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
select { font: inherit; font-size: 15px; width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; background: var(--panel); color: var(--ink); }
.cmp { display: grid; gap: 16px; margin-top: 12px; }
.cmp .lab { font-size: 13px; color: var(--muted); }
.dbar { display: grid; grid-template-columns: minmax(0, 1fr) 72px; gap: 8px; align-items: center; margin-top: 6px; }
.dbar .track { height: 10px; grid-column: auto; }
.dbar .val { font-size: 13px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); flex-wrap: wrap; margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- графік ---------- */
.chart { position: relative; margin-top: 8px; touch-action: pan-y; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .ax { font-size: 11px; fill: var(--muted); font-family: var(--body); }
.chart .gl { stroke: var(--line); stroke-dasharray: 3 4; }
.ln { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.pt { opacity: 0; animation: fade .3s ease .9s forwards; transform-box: fill-box; transform-origin: center; transition: transform .2s var(--ease); }
.pt.on { transform: scale(1.8); }
@keyframes fade { to { opacity: 1; } }
.guide { stroke: var(--muted); stroke-width: 1; opacity: 0; transition: opacity .15s; }
.guide.on { opacity: .5; }
.tip { position: absolute; top: 0; z-index: 3; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 12px; min-width: 120px; opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; }
.tip.on { opacity: 1; transform: none; }
.tip b { display: block; margin-bottom: 4px; font-size: 12px; }
.tip div { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.tip div span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }

/* ---------- заготовки й порожні стани ---------- */
.sk { background: linear-gradient(90deg, var(--sk) 25%, var(--sk-hi) 37%, var(--sk) 63%); background-size: 400% 100%; animation: sk 1.4s ease infinite; border-radius: 8px; }
@keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
.skl { height: 12px; margin-top: 8px; }
.empty { display: grid; gap: 6px; justify-items: start; padding: 16px; border: 1px dashed var(--line); border-radius: 12px; background: var(--soft); margin-top: 4px; animation: enter .3s var(--ease) both; }
.empty b { font-size: 14px; }
.empty p { margin: 0; font-size: 13px; color: var(--muted); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; transition: background .2s, border-color .2s; }
.btn:hover { border-color: var(--muted); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; }
.btn.p { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn[disabled] { opacity: .6; cursor: default; }
.btn .ico { width: 18px; height: 18px; }

/* ---------- нижній аркуш ---------- */
.shade { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 50; opacity: 0; pointer-events: none; transition: opacity .25s; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; max-height: 88vh; overflow-y: auto; overscroll-behavior: contain; background: var(--panel); border-radius: 20px 20px 0 0; padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); transform: translateY(105%); visibility: hidden; transition: transform .3s var(--ease), visibility 0s .3s; max-width: 720px; margin: 0 auto; }
body.sheet-open .shade { opacity: 1; pointer-events: auto; }
body.sheet-open .sheet { transform: none; visibility: visible; transition: transform .3s var(--ease); }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.x { position: absolute; right: 12px; top: 10px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--soft); display: grid; place-items: center; }
.x .ico { width: 18px; height: 18px; }
.sheet .hd { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 16px; padding-right: 32px; }
.sheet .cov { width: 112px; height: 196px; border-radius: 12px; background: var(--soft) center/cover; }
.sheet .big { font-size: 22px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; margin: 16px 0 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.cap { font-size: 14px; color: var(--muted); margin: 12px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
.sheet h2 { margin-top: 16px; }

/* ---------- тренди ---------- */
.trend { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); animation: enter .4s var(--ease) both; }
.trend:last-child { border-bottom: 0; }
.trend .l { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trend .m { grid-column: 1; font-size: 12px; color: var(--muted); }
.delta { grid-row: 1 / span 2; grid-column: 2; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; padding: 4px 10px; border-radius: 999px; }
.delta.up { color: var(--accent); background: var(--accent-soft); }
.delta.down { color: var(--us); background: var(--us-soft); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 759px) { .two { grid-template-columns: minmax(0, 1fr); } }
.sub2 { font-size: 13px; font-weight: 600; margin: 4px 0 4px; display: flex; align-items: center; gap: 6px; }
.sub2 .ico { width: 16px; height: 16px; }
/* ---------- карта ніш ---------- */
.heatwrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; scrollbar-width: thin; }
.heat { border-collapse: separate; border-spacing: 3px; font-size: 12px; }
.heat th { font-weight: 500; color: var(--muted); }
.heat thead th { height: 132px; vertical-align: bottom; padding: 0 0 4px; }

  // Рилси конкурентів для свайп-файлу: верхня третина (хіти) і нижня (звичайні дні)
  async function swipeRows(v) {
    const D = await loadData(); if (!D) return { rows: [], text: "" };
    const E = enrich(D), days = parseInt(v.days) || 120, fq = (v.focus || "").toLowerCase();
    const pool = E.rows.filter((o) => o.r.account !== ZIN && !o.ad && o.x != null && o.age >= 3 && o.age <= days && first(o.r).length > 8 && (!fq || (o.r.topic + " " + first(o.r) + " " + o.r.caption).toLowerCase().includes(fq)));
    const top = pool.filter((o) => o.x >= 3).sort((a, b) => b.x - a.x).slice(0, 24);
    const bottom = pool.filter((o) => o.x < 1.5).sort(() => Math.random() - 0.5).slice(0, 14);
    const rows = top.concat(bottom);
    return { rows, text: "Вибірка: " + rows.length + " рилсів, " + new Set(rows.map((o) => o.r.account)).size + " акаунтів. Верхня частина — × ≥ 3, нижня — × < 1,5.\n" + rows.map((o) => [o.r.code, "@" + o.r.account, "×" + o.x.toFixed(1), nf.format(o.v) + " перегл.", (o.r.duration_s ? Math.round(o.r.duration_s) + " с" : ""), o.r.topic || "", "кадр: " + (o.r.v_frame || "?"), "заклик: " + (o.r.cta || ""), "хук: «" + first(o.r) + "»"].join(" | ")).join("\n") };
  }

  async function renderSlides(slides) {
    try { await Promise.all([document.fonts.load('600 64px "Unbounded"'), document.fonts.load('400 40px "Onest"'), document.fonts.load('600 40px "Onest"')]); } catch (e) {}
    const W = 1080, Hh = 1350, PAD = 120, N = slides.length, out = [];
    const C = { teal: "#1f6f78", ink: "#18202b", cream: "#f6f1ea", orange: "#c2621a", white: "#ffffff", muted: "#5d6877" };
    const wrap = (ctx, text, maxW) => { const ws = String(text || "").split(/\s+/).filter(Boolean), lines = []; let line = ""; for (const w of ws) { const t = line ? line + " " + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; } if (line) lines.push(line); return lines; };
    const fit = (ctx, text, font, max, min, maxW, maxLines) => { for (let s = max; s >= min; s -= 4) { ctx.font = font.replace("{s}", s); const l = wrap(ctx, text, maxW); if (l.length <= maxLines) return { s, l }; } ctx.font = font.replace("{s}", min); return { s: min, l: wrap(ctx, text, maxW) }; };
    slides.forEach((sl, i) => {
      const cv = document.createElement("canvas"); cv.width = W; cv.height = Hh; const x = cv.getContext("2d");
      const cover = i === 0, cta = sl.role === "cta", recap = sl.role === "recap";
      x.fillStyle = cover ? C.teal : cta ? C.orange : C.cream; x.fillRect(0, 0, W, Hh);
      const fg = cover || cta ? C.white : C.ink;
      x.fillStyle = cover || cta ? "rgba(255,255,255,.75)" : C.muted; x.font = '500 30px "Onest", sans-serif'; x.textBaseline = "alphabetic";
      x.textAlign = "right"; x.fillText((i + 1) + "/" + N, W - PAD, PAD); x.textAlign = "left"; x.fillText("@" + ZIN, PAD, Hh - 80);
      if (!cover && !cta) { x.fillStyle = C.teal; x.fillRect(PAD, PAD + 60, 80, 10); }
      const hf = fit(x, (sl.head || "").toUpperCase(), '600 {s}px "Unbounded", sans-serif', cover ? 112 : 84, 44, W - PAD * 2, cover ? 5 : 4);
      let y = cover ? 420 : PAD + 170;
      x.fillStyle = fg; x.font = '600 ' + hf.s + 'px "Unbounded", sans-serif';
      for (const l of hf.l) { y += hf.s * 1.12; x.fillText(l, PAD, y); }
      if (sl.body) {
        y += cover ? 60 : 50;
        const items = recap ? String(sl.body).split(/\n|;\s*|(?<=\.)\s+(?=\d)/).filter((s) => s.trim()) : [sl.body];
        const bs = fit(x, items.join(" "), '400 {s}px "Onest", sans-serif', cover ? 52 : 54, 34, W - PAD * 2, recap ? 14 : 9).s;
        x.font = '400 ' + bs + 'px "Onest", sans-serif'; x.fillStyle = cover || cta ? "rgba(255,255,255,.92)" : C.ink;
        for (const it of items) { for (const l of wrap(x, (recap ? "• " : "") + it.trim(), W - PAD * 2)) { y += bs * 1.4; if (y < Hh - 150) x.fillText(l, PAD, y); } if (recap) y += bs * 0.4; }
      }
      out.push(cv.toDataURL("image/png"));
    });
    return out;
  }

    if (r.counts) { const m = el("div", "meta"); for (const k in r.counts) if (r.counts[k]) m.append(el("span", "pill" + (k === "ЛІД" || k === "ПИТАННЯ" ? " ok" : k === "ШУМ" ? " bad" : ""), k + ": " + r.counts[k])); c.append(m); }
    const ORDER = ["СЛОВО", "ЛІД", "ПО СУТІ", "ПИТАННЯ", "ПІДТРИМКА", "ШУМ"], items = r.items || [];
    for (const b of ORDER) {
      const a = items.filter((x) => x.bucket === b); if (!a.length) continue;
      const s = el("div", "bucket"); s.append(el("h3", null, b + " · " + a.length));
      if (b === "ШУМ") { s.append(el("p", "note2", "Не відповідаємо: відповідь дає їм охоплення. Образливе приховайте.")); a.forEach((x) => s.append(el("div", "cm", (x.who ? x.who + ": " : "") + x.comment))); c.append(s); continue; }
      a.forEach((x) => { s.append(el("div", "cm", (x.who ? x.who + ": " : "") + "«" + x.comment + "»")); if (x.reply) s.append(textBlock(x.reply)); if (x.reel) { const w = el("div", "meta"); w.append(el("span", "pill ok", "Це тема для рилса-відповіді"), btn("Написати рилс", "sm p", "reel", () => go("reel", { idea: "Рилс-відповідь на коментар " + (x.who || "") + ": «" + x.comment + "». Хук-орієнтир (#16): " + x.reel }))); s.append(w); } });
      c.append(s);
    }
    if (r.note) c.append(el("p", "note2", r.note));
    placeholders(r, c); box.append(c);
  };

  R.dm = (r, box) => {
    const c = card("Повідомлення");
    if (r.warning) { const w = el("div", "warnbox"); w.textContent = r.warning; c.append(w); }
    (r.messages || []).forEach((m) => { c.append(el("div", "sub2", (m.label || "") + (m.day && m.day !== "зараз" ? " · через " + m.day.replace("+", "") + " дн." : "") + " · " + (m.text || "").length + " симв.")); c.append(textBlock(m.text || "")); });
    c.append(el("p", "note2", "Надсилайте вручну. Масові розсилки тим, хто не писав першим, порушують правила Instagram і блокують акаунт. Автовідповідь на слово через інструменти Instagram — можна."));
    placeholders(r, c); box.append(c);
  };

  R.comment = (r, box) => {
    const c = card("Коментарі");
    (r.options || []).forEach((o, i) => { c.append(el("div", "sub2", (o.post ? o.post + " · " : "") + "Тип " + (o.type_id || "") + " · " + (o.type || "") + (i === r.pick && !o.post ? " · радимо цей" : ""))); c.append(textBlock(o.text || "")); });
    if (r.why) c.append(el("p", "note2", r.why));
    c.append(el("p", "note2", "Публікуйте самі й рано: коментар у першу годину їде разом із рилсом. Без реклами центру."));
    placeholders(r, c); box.append(c);
  };

  R.profile = (r, box) => {
    const c = card("Оцінка профілю");
    const top = el("div", "meta"); top.append(el("span", "bigscore", (r.score || 0) + "/100")); if (r.after) top.append(el("span", "pill ok", "після правок ≈ " + r.after)); c.append(top);
    const t = el("table", "tbl"); t.innerHTML = "<thead><tr><th>Пункт</th><th class=num>Бали</th><th>Чому</th></tr></thead>"; const tb = el("tbody");
    (r.items || []).slice().sort((a, b) => (b.max - b.got) - (a.max - a.got)).forEach((x) => { const tr = el("tr"); tr.append(el("td", null, x.name), el("td", "num", x.got + "/" + x.max), el("td", null, x.note || "")); tb.append(tr); });
    t.append(tb); c.append(t); box.append(c);
    const w = card("Що змінити, по черзі");
    (r.rewrites || []).forEach((x) => { w.append(el("div", "sub2", x.field)); if (x.why) w.append(el("p", "note2", x.why)); (x.options || []).forEach((o) => { const tb2 = textBlock(o, { extra: (m, txt) => { if (/імен/i.test(x.field)) m.append(el("span", "pill " + (txt.length <= 30 ? "ok" : "bad"), txt.length + "/30")); if (/біо/i.test(x.field) && !/рядок/i.test(x.field)) m.append(el("span", "pill " + (txt.length <= 150 ? "ok" : "bad"), txt.length + "/150")); } }); w.append(tb2); }); });
    if (r.rest) { const z = el("div", "warnbox"); z.textContent = "Переписуванням не вирішити: " + r.rest; w.append(z); }
    placeholders(r, w); box.append(w);
  };

  R.audit = (r, box, v, data) => {
    if (data) {
      const c = card("Аудит · " + data.n + " рилсів · " + data.from + " – " + data.to + " · медіана " + nf.format(data.median));
      const tbl = (title, list) => { c.append(el("div", "sub2", title)); const tw = el("div", "wrapx"), t = el("table", "tbl"); t.innerHTML = "<thead><tr><th class=num>×</th><th>Рилс</th><th class=num>Перегл.</th><th class=num>Поширень на 100 охопл.</th><th class=num>Підписок</th><th class=num>Збережень</th><th class=num>с</th></tr></thead>"; const tb = el("tbody"); list.forEach((x) => { const tr = el("tr"); const td = el("td"); if (x.url) { const a = el("a", null, x.cap || "без підпису"); a.href = x.url; a.target = "_blank"; td.append(a); } else td.textContent = x.cap || "без підпису"; tr.append(el("td", "num", x.x.toFixed(1)), td, el("td", "num", nf.format(x.views)), el("td", "num", String(x.sends)), el("td", "num", String(x.fol)), el("td", "num", String(x.sav)), el("td", "num", String(Math.round(x.dur)))); tb.append(tr); }); t.append(tb); tw.append(t); c.append(tw); };
      tbl("Топ-5 за кратністю до медіани", data.top); tbl("Низ-5", data.bottom); tbl("Найбільше поширень на охоплення (головний сигнал)", data.topSends);
      if (data.lengths) { const m = el("div", "meta"); data.lengths.forEach((l) => m.append(el("span", "pill", l.len + ": ×" + l.x + " (n=" + l.n + ")"))); c.append(el("div", "sub2", "Довжина (медіана кратності)"), m); }
      if (data.highViewsLowFollows) c.append(el("p", "note2", data.highViewsLowFollows + " рилсів мали ×2+ переглядів, але майже без підписок: це сигнал перевірити профіль."));
      box.append(c);
    }
    const f = card("Що кажуть дані");
    (r.findings || []).forEach((x, i) => { const d = el("div", "fr"); const b = el("div"); b.append(el("b", null, x.claim || ""), el("div", "k", (x.evidence || "") + (x.confidence ? " · впевненість: " + x.confidence : ""))); d.append(el("span", "n", String(i + 1)), b); f.append(d); });
    if (r.profile_problem) { const w = el("div", "warnbox"); w.append(document.createTextNode("Перегляди є, підписок мало: це проблема профілю, а не рилсів. ")); const a = btn("Оцінити профіль", "sm", "user", () => go("profile")); w.append(a); f.append(w); }
    if (r.stop) f.append(el("div", "sub2", "ПРИПИНИТИ"), el("p", null, r.stop));
    if (r.more) f.append(el("div", "sub2", "РОБИТИ БІЛЬШЕ"), el("p", null, r.more));
    box.append(f);
    if (r.next_hooks && r.next_hooks.length) { const n = card("Хуки на наступний тиждень"); r.next_hooks.forEach((y) => { const s = hookScore(y.hook), d = el("div", "hook"), top = el("div", "top"); top.append(el("span", "score", String(s.overall)), el("span", "pill", "#" + y.formula_id)); d.append(top, el("div", "scr", y.on_screen || ""), el("div", "sp", qq(y.hook))); const b = el("div", "btns"); b.style.marginTop = "0"; b.append(btn("Написати рилс", "sm p", "reel", () => go("reel", { idea: "Хук за формулою #" + y.formula_id + ": " + y.hook }))); d.append(b); n.append(d); }); box.append(n); }
    placeholders(r, f);
  };

  R.human = (r, box, v) => {
    if (r && r.text) { const c = card("Переписано"); c.append(textBlock(r.text)); box.append(c); return; }
    const before = H.detect(v.text), cl = H.clean(v.text), after = H.detect(cl.text);
    const c = card("Результат");
    const m = el("div", "meta"); m.append(el("span", "pill", "Було " + before.overall + " · " + before.verdict), el("span", "pill " + (after.pass ? "ok" : "warn"), "Стало " + after.overall + " · " + after.verdict)); c.append(m);
    if (cl.changes.length) c.append(el("p", "note2", "Прибрано автоматично: " + cl.changes.join(", ")));
    c.append(textBlock(cl.text));
    c.append(el("p", "note2", "Це 5 локальних перевірок (ритм, конкретика, штампи, відбитки ШІ, живий голос), схожих на те, що дивляться детектори. Це не GPTZero і не гарантія, але виправлення цих місць зазвичай робить текст живішим."));
    box.append(c);
  };

  R.voice = (r, box) => { const c = card("Голос центру збережено"); c.append(el("p", "note2", "Записано на аркуш voice у таблиці. Тепер він додається до кожного запиту Студії. Можна правити прямо в таблиці.")); c.append(textBlock(r.voice || "")); box.append(c); };

  // =====================================================================
  // ІСТОРІЯ
  // =====================================================================
  let histLoaded = false;
  async function loadHist() {
    const box = $("hist"); box.replaceChildren(); for (let i = 0; i < 4; i++) box.append(el("div", "sk skl"));
    try {
      const j = await TG.api("studio_hist"); box.replaceChildren(); histLoaded = true;
      if (!j.items.length) { box.append(el("p", "note2", "Поки порожньо. Створіть щось у Студії.")); return; }
      for (const it of j.items) {
        const t = TOOL[it.tool] || { name: it.tool, icon: "spark" };
        const row = el("button", "fr"); row.style.cssText = "width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);";
        const n = el("span", "n"); n.append(ico(t.icon)); n.querySelector("svg").style.cssText = "width:16px;height:16px";
        const d = el("div"); d.append(el("b", null, t.name + (it.title ? ": " + it.title : "")), el("div", "k", (it.byName || "") + " · " + new Date(it.at).toLocaleString("uk-UA", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })));
        row.append(n, d);
        row.onclick = () => { setTab("tool"); const box2 = $("toolp"); box2.replaceChildren(); const back = el("button", "back"); back.append(ico("chev"), document.createTextNode("До історії")); back.onclick = () => setTab("hist"); const res = el("div", "res"); box2.append(back, res); const v = { len: "30 с", _rows: [] }; try { (R[it.tool] || R.generic)(it.result || {}, res, v, it.data); } catch (e) { R.generic(it.result || {}, res); } };
        box.append(row);
      }
    } catch (e) { box.replaceChildren(el("p", "note2", errText(e))); }
  }

  // =====================================================================
  // НАВІГАЦІЯ
  // =====================================================================
  function setTab(t) {
    document.querySelectorAll("section[data-p]").forEach((s) => (s.hidden = s.dataset.p !== t));
    document.querySelectorAll(".item[data-t]").forEach((b) => b.setAttribute("aria-current", b.dataset.t === (t === "tool" ? "home" : t) ? "page" : "false"));
    $("title").textContent = t === "hist" ? "Історія Студії" : t === "tool" && cur ? cur.name : "Студія";
    drawer(false); window.scrollTo(0, 0); syncBack();
  }
  document.querySelectorAll(".item[data-t]").forEach((b) => (b.onclick = () => { if (b.dataset.t === "hist") { if (location.hash) history.replaceState(null, "", location.pathname + location.search); setTab("hist"); loadHist(); } else { location.hash = ""; route(); } }));
  function route() {
    const id = location.hash.slice(1);
    if (TOOL[id]) { cur = TOOL[id]; renderTool(cur); prefill = {}; setTab("tool"); }
    else { cur = null; setTab("home"); }
  }
  function syncBack() {
    if (!tg || !tg.BackButton) return;
    const show = document.body.classList.contains("drawer") || !!location.hash || !$("toolp").hidden;
    show ? tg.BackButton.show() : tg.BackButton.hide();
  }
  if (tg && tg.BackButton) tg.BackButton.onClick(() => { if (document.body.classList.contains("drawer")) drawer(false); else if (location.hash) history.back(); else { location.hash = ""; route(); } });
  window.addEventListener("hashchange", route);

  renderHome();
  route();
  TG.gate({ quiet: true }).catch(() => {});
  window.__studio = { H, hookScore, beatSheet, lintCaption, R, renderSlides };
})();
</script>
